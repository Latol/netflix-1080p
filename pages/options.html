<!DOCTYPE html>
<html>
    <head>
        <title>New Netflix 1080p Options</title>
        <link rel="stylesheet" href="picnic.min.css">
        <style>
            html {
                height: auto;
            }

            body {
                margin: 20px;
                overflow: auto;
                max-width: 46rem;
            }
        </style>
    </head>
    <body>
        <div class="flex">
            <div class="full">
                <label>
                    <input type="checkbox" id="use-51" />
                    <span class="checkable">Use 5.1 audio when available.</span>
                </label>
            </div>
            <div class="full">
                <label>
                    <input type="checkbox" id="set-max-bitrate" />
                    <span class="checkable">Automatically select best bitrate available</span>
                </label>
            </div>
            <div class="full">
                <label>
                    <input type="checkbox" id="disable-vp9" />
                    <span class="checkable">Disable VP9 codec</span>
                </label>
            </div>
            <div class="full">
                <label>
                    <input type="checkbox" id="disable-avchigh" />
                    <span class="checkable">Disable AVChigh codec</span>
                </label>
            </div>
            <div class="full">
                <label>
                    <input type="checkbox" id="disable-av1" />
                    <span class="checkable">Disable AV1 codec</span>
                </label>
            </div>
            <div class="full">
                <label>
                    <input type="checkbox" id="show-all-subs" />
                    <span class="checkable">Show all subtitle tracks</span>
                </label>
            </div>
            <div class="full">
                <button id="save">Save</button>
                <span id="options-saved" class="label success" style="font-size: 16px; display: none">Options saved!</span>
            </div>
        </div>

        <hr>
        <div class="flex">
            <div class="full">
                <h3>診断ログ</h3>
                <p>このビルドは 1.34.0 の bitrate 選択を変えません。設定を自動では書きません。拡張IDは <code id="diagnostic-id"></code> です。Web Store 版 <code id="store-id"></code> と同時に有効にしないでください。</p>
                <p id="diagnostic-status"></p>
                <p>ユーザー提供のオプション画面では6項目すべてがチェックでした。codec の3項目は「無効化する」スイッチなので、チェックは VP9 / AVChigh / AV1 の無効化です。これは画面の観測で、元の拡張の保存値は読んでいません。比較の前に、上の6項目をその画面と同じにして Save してください。</p>
                <button id="download-log" type="button">診断ログを書き出す</button>
                <button id="clear-log" type="button">診断ログを消去</button>
                <span id="log-status"></span>
            </div>
        </div>

        <script src="../diagnostic/core.js"></script>
        <script src="options.js"></script>
    </body>
</html>
