<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>fixture</title></head>
<body>
<script>
window.__menu = [];
window.__samples = [];
window.__sampler = [];
window.__players = [];
window.__clicks = 0;
window.__keydowns = 0;
window.__clockMode = "real";
window.__timerAt = [];
window.__realSetTimeout = window.setTimeout.bind(window);
window.__realSetInterval = window.setInterval.bind(window);
window.__realDateNow = Date.now.bind(Date);
Date.now = function () {
    var base = window.__realDateNow();
    if (window.__clockMode === "forward") return base + 60 * 60 * 1000;
    if (window.__clockMode === "back") return base - 60 * 60 * 1000;
    return base;
};
window.setTimeout = function (fn, ms) {
    return window.__realSetTimeout(function () {
        window.__timerAt.push(Date.now());
        return fn();
    }, ms);
};
window.setInterval = function (fn, ms) {
    return window.__realSetInterval(function () {
        window.__timerAt.push(Date.now());
        return fn();
    }, ms);
};
window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || data.source !== "netflix-1080p-diagnostic" || !data.event) return;
    if (data.event.type === "menu" && data.event.label === "video") {
        window.__menu.push({
            phase: data.event.phase,
            count: data.event.snapshot ? data.event.snapshot.count : 0
        });
    }
    if (data.event.type === "sample") {
        window.__samples.push({
            at: data.event.at,
            perf: data.event.perf,
            index: data.event.index,
            width: data.event.rendered ? data.event.rendered.width : null,
            height: data.event.rendered ? data.event.rendered.height : null
        });
    }
    if (data.event.type === "player") window.__players.push({ replaced: data.event.replaced === true, playerGeneration: data.event.playerGeneration });
    if (data.event.type === "sampler") {
        window.__sampler.push({
            phase: data.event.phase,
            reason: data.event.reason,
            generation: data.event.generation,
            perfGapMs: data.event.perfGapMs,
            dateGapMs: data.event.dateGapMs
        });
    }
});
document.addEventListener("click", function (event) {
    if (event.target && event.target.id === "override-button") window.__clicks += 1;
}, true);
window.addEventListener("keydown", function (event) {
    if (event.ctrlKey && event.altKey && event.shiftKey) window.__keydowns += 1;
}, true);
</script>
<!-- BUNDLE_SCRIPTS -->
<script>
function wait(ms) {
    return new Promise(function (resolve) { window.__realSetTimeout(resolve, ms); });
}

function videoSelect(values) {
    var wrap = document.createElement("div");
    var label = document.createElement("div");
    label.textContent = "Video Bitrate / VMAF";
    var select = document.createElement("select");
    wrap.appendChild(label);
    wrap.appendChild(select);
    values.forEach(function (value, index) {
        var option = document.createElement("option");
        option.value = String(value);
        option.text = String(value);
        option.selected = index === values.length - 1;
        select.appendChild(option);
    });
    return wrap;
}

window.runMenuProbe = function () {
    window.__menu = [];
    var root = document.createElement("div");
    root.className = "player-streams";
    root.id = "menu-root";
    var selectWrap = document.createElement("div");
    var label = document.createElement("div");
    label.textContent = "Video Bitrate / VMAF";
    var select = document.createElement("select");
    selectWrap.appendChild(label);
    selectWrap.appendChild(select);
    root.appendChild(selectWrap);
    document.body.appendChild(root);
    [300000, 5800000].forEach(function (value, index, list) {
        var option = document.createElement("option");
        option.value = String(value);
        option.text = String(value);
        option.selected = index === list.length - 1;
        select.appendChild(option);
    });
    return wait(40).then(function () {
        var built = window.__menu.filter(function (event) { return event.phase === "menu-built"; });
        var updated = window.__menu.filter(function (event) { return event.phase === "menu-updated"; });
        var extra = document.createElement("option");
        extra.value = "8000000";
        extra.text = "8000000";
        select.appendChild(extra);
        return wait(40).then(function () {
            var later = window.__menu.filter(function (event) { return event.phase === "menu-updated"; });
            return {
                label: "mutation_observer_same_task",
                videoMenuBuilt: built.length,
                videoMenuUpdatedSameTurn: updated.length,
                videoMenuUpdatedLater: later.length,
                laterCount: later.length ? later[later.length - 1].count : 0
            };
        });
    });
};

function installPlaybackMenu(values) {
    var old = document.getElementById("playback-menu");
    if (old) old.remove();
    var root = document.createElement("div");
    root.id = "playback-menu";
    root.className = "player-streams";
    root.appendChild(videoSelect(values));
    var audioWrap = document.createElement("div");
    var audioLabel = document.createElement("div");
    audioLabel.textContent = "Audio Bitrate";
    var audio = document.createElement("select");
    [96, 640].forEach(function (value, index, list) {
        var option = document.createElement("option");
        option.value = String(value);
        option.text = String(value);
        option.selected = index === list.length - 1;
        audio.appendChild(option);
    });
    audioWrap.appendChild(audioLabel);
    audioWrap.appendChild(audio);
    root.appendChild(audioWrap);
    var button = document.createElement("button");
    button.id = "override-button";
    button.textContent = "Override";
    button.addEventListener("click", function () {
        root.remove();
    });
    root.appendChild(button);
    document.body.appendChild(root);
}

function dispatchSignal(type, extra) {
    var event = new Event(type, { bubbles: true });
    if (extra) Object.keys(extra).forEach(function (key) { event[key] = extra[key]; });
    document.dispatchEvent(event);
    window.dispatchEvent(event);
}

function jumped(stamp, realBase, direction) {
    if (direction === "forward") return stamp > realBase + 30 * 60 * 1000;
    return stamp < realBase - 30 * 60 * 1000;
}

window.runDimensionProbe = function () {
    var canvas = document.createElement("canvas");
    canvas.width = 320;
    canvas.height = 180;
    var context = canvas.getContext("2d");
    context.fillStyle = "#2040c0";
    context.fillRect(0, 0, 320, 180);
    var stream;
    try {
        stream = canvas.captureStream(1);
    } catch (error) {
        return Promise.resolve({
            supported: false,
            limitation: "capture-unsupported",
            label: "local_nondrm_canvas_capture",
            timing: "real_chrome_timers",
            notNetflix: true,
            notQualityDrop: true
        });
    }
    var video = document.createElement("video");
    video.muted = true;
    video.srcObject = stream;
    document.body.appendChild(video);
    var start = window.__samples.length;
    return video.play().then(function () {
        return wait(1500).then(function () {
            var matched = window.__samples.slice(start).filter(function (sample) {
                return sample.width === 320 && sample.height === 180;
            });
            return {
                supported: true,
                label: "local_nondrm_canvas_capture",
                notNetflix: true,
                notQualityDrop: true,
                timing: "real_chrome_timers_not_virtualized",
                elementWidth: video.videoWidth,
                elementHeight: video.videoHeight,
                samplesWithDimensions: matched.length
            };
        });
    }).catch(function () {
        return {
            supported: false,
            limitation: "capture-unsupported",
            label: "local_nondrm_canvas_capture",
            timing: "real_chrome_timers",
            notNetflix: true,
            notQualityDrop: true
        };
    });
};

window.runGapWiringProbe = function () {
    var perfBase = performance.now.bind(performance);
    var perfExtra = 0;
    performance.now = function () { return perfBase() + perfExtra; };
    var start = window.__sampler.length;
    perfExtra += 20000;
    return wait(700).then(function () {
        var first = window.__sampler.slice(start).filter(function (event) {
            return event.reason === "execution-gap" && (event.phase === "restart" || event.phase === "start");
        });
        var generation = first.length ? first[0].generation : null;
        var afterFirst = window.__sampler.length;
        perfExtra += 20000;
        return wait(700).then(function () {
            var extra = window.__sampler.slice(afterFirst).filter(function (event) {
                return event.phase === "restart" || event.phase === "start";
            });
            return {
                label: "page_hook_gap_wiring",
                virtualClock: true,
                notMacWake: true,
                sameUrl: true,
                executionGapEvents: first.length,
                executionGapGeneration: generation,
                rawPerfGapMs: first.length ? first[0].perfGapMs : null,
                duplicateRestarts: extra.length
            };
        });
    });
};

window.readProbe = function () {
    return { clicks: window.__clicks, keydowns: window.__keydowns, players: window.__players.length };
};

window.runSignalProbe = function () {
    var settings = document.getElementById("netflix-1080p-settings");
    if (!settings) {
        settings = document.createElement("script");
        settings.id = "netflix-1080p-settings";
        settings.type = "application/json";
        document.documentElement.appendChild(settings);
    }
    settings.text = JSON.stringify({
        use6Channels: true,
        setMaxBitrate: true,
        disableVP9: true,
        disableAVChigh: true,
        disableAV1: true,
        showAllSubs: true
    });
    var script = document.createElement("script");
    script.src = "/netflix_max_bitrate.js";
    document.documentElement.appendChild(script);
    return new Promise(function (resolve, reject) {
        script.onload = function () {
            wait(700).then(function () {
                installPlaybackMenu([300000, 5800000]);
                return wait(500);
            }).then(function () {
                var initial = window.readProbe();
                var realBase = window.__realDateNow();
                window.__clockMode = "forward";
                var forwardStartSamples = window.__samples.length;
                var forwardStartTimers = window.__timerAt.length;
                return wait(1600).then(function () {
                    var forwardSamples = window.__samples.slice(forwardStartSamples).filter(function (sample) {
                        return jumped(sample.at, realBase, "forward");
                    });
                    var forwardTimers = window.__timerAt.slice(forwardStartTimers).filter(function (stamp) {
                        return jumped(stamp, realBase, "forward");
                    });
                    window.__clockMode = "back";
                    var backStartSamples = window.__samples.length;
                    var backStartTimers = window.__timerAt.length;
                    return wait(1600).then(function () {
                        var backSamples = window.__samples.slice(backStartSamples).filter(function (sample) {
                            return jumped(sample.at, realBase, "back");
                        });
                        var backTimers = window.__timerAt.slice(backStartTimers).filter(function (stamp) {
                            return jumped(stamp, realBase, "back");
                        });
                        window.__clockMode = "real";
                        var restoredStart = window.__samples.length;
                        return wait(1300).then(function () {
                            var restored = window.__samples.slice(restoredStart).filter(function (sample) {
                                return Math.abs(sample.at - window.__realDateNow()) < 5 * 60 * 1000;
                            });
                            dispatchSignal("visibilitychange");
                            dispatchSignal("visibilitychange");
                            dispatchSignal("pageshow", { persisted: false });
                            dispatchSignal("pageshow", { persisted: true });
                            dispatchSignal("freeze");
                            dispatchSignal("resume");
                            dispatchSignal("online");
                            dispatchSignal("online");
                            dispatchSignal("offline");
                            var frame = document.createElement("iframe");
                            document.body.appendChild(frame);
                            var otherDocumentPerformanceNow = frame.contentWindow.performance.now();
                            var sameDocumentPerformanceNow = performance.now();
                            return wait(700).then(function () {
                                var afterSignals = window.readProbe();
                                var playersBefore = window.__players.length;
                                installPlaybackMenu([5800000, 300000]);
                                var replacement = document.createElement("video");
                                document.body.appendChild(replacement);
                                return wait(600).then(function () {
                                    var menu = document.getElementById("playback-menu");
                                    var optionValues = [];
                                    if (menu) {
                                        menu.querySelectorAll("select option").forEach(function (option) {
                                            optionValues.push(option.value);
                                        });
                                    }
                                    resolve({
                                        label: "source_timers_under_altered_clock_then_dispatched_signals",
                                        notOsWake: true,
                                        notBrowserFreeze: true,
                                        notQualityTransition: true,
                                        initialClicks: initial.clicks,
                                        clicksAfterClock: afterSignals.clicks,
                                        clicksAfterSignals: afterSignals.clicks,
                                        keydownsAfterInitial: initial.keydowns,
                                        keydownsAfterSignals: afterSignals.keydowns,
                                        clicksAfterPlayerReplacement: window.__clicks,
                                        forwardTimerCallbacks: forwardTimers.length,
                                        backwardTimerCallbacks: backTimers.length,
                                        forwardSamples: forwardSamples.length,
                                        backwardSamples: backSamples.length,
                                        restoredSamples: restored.length,
                                        forwardSampleAt: forwardSamples.length ? forwardSamples[0].at : null,
                                        forwardSamplePerf: forwardSamples.length ? forwardSamples[0].perf : null,
                                        playersBeforeReplacement: playersBefore,
                                        playersAfterReplacement: window.__players.length,
                                        modelOptionValues: optionValues,
                                        modelLabel: "player_and_reversed_menu_inserted_by_fixture",
                                        sameDocumentPerformanceNow: sameDocumentPerformanceNow,
                                        otherDocumentPerformanceNow: otherDocumentPerformanceNow,
                                        comparedMonotonicAcrossTimeOrigins: false,
                                        onlineMeansNetflixReachable: false
                                    });
                                });
                            });
                        });
                    });
                });
            }).catch(reject);
        };
        script.onerror = function () { reject(new Error("bitrate script failed")); };
    });
};
</script>
